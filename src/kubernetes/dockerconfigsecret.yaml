# Образы в GHCR публичные, поэтому здесь пустой набор учётных данных и kubelet
# тянет их анонимно. Для приватных пакетов значение заменяется на base64 от
# ~/.docker/config.json с записью для ghcr.io: base64 -w0 ~/.docker/config.json
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  .dockerconfigjson: eyJhdXRocyI6e319
type: kubernetes.io/dockerconfigjson
