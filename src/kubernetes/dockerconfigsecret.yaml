# Образы сервисов опубликованы в GitHub Container Registry с публичным доступом,
# поэтому секрет содержит пустой набор учётных данных - kubelet тянет образы
# анонимно, а ревьюеру не нужен собственный токен.
#
# Если сделать пакеты приватными, значение надо заменить на base64 от
# ~/.docker/config.json с записью для ghcr.io:
#   echo -n ВАШ_ЛОГИН:ВАШ_ТОКЕН | base64          # это значение поля auth
#   base64 -w0 ~/.docker/config.json              # это значение .dockerconfigjson
# Токен создаётся на https://github.com/settings/tokens с правом read:packages.
# Реальный токен в публичный репозиторий коммитить нельзя: base64 не шифрование.
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  .dockerconfigjson: eyJhdXRocyI6e319
type: kubernetes.io/dockerconfigjson
